<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Settings | OmniDesk</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="css/main.css">
    <link rel="stylesheet" href="css/responsive.css">
</head>
<body>
    <div id="app-layout"></div>
    <script src="js/app.js"></script>
    <script>
        document.addEventListener('omniReady', () => {
            const settings = loadData('omni_settings');
            document.getElementById('set-cursor').checked = settings.cursorsEnabled;
            document.getElementById('set-view').value = settings.defaultTaskView || 'kanban';
        });

        function saveSettingsForm() {
            const settings = loadData('omni_settings');
            settings.cursorsEnabled = document.getElementById('set-cursor').checked;
            settings.defaultTaskView = document.getElementById('set-view').value;
            saveData('omni_settings', settings);
            applyTheme(); // reapplies cursors
            alert('Settings saved!');
        }

        function exportData() {
            const data = {
                tasks: loadData('omni_tasks'), projects: loadData('omni_projects'),
                income: loadData('omni_income'), roadmap: loadData('omni_roadmap'), settings: loadData('omni_settings')
            };
            const blob = new Blob([JSON.stringify(data)], {type: "application/json"});
            const a = document.createElement('a');
            a.href = URL.createObjectURL(blob);
            a.download = `omnidesk_backup_${new Date().toISOString().slice(0,10)}.json`;
            a.click();
        }

        function importData(e) {
            const file = e.target.files[0];
            if(!file) return;
            const reader = new FileReader();
            reader.onload = function(event) {
                try {
                    const data = JSON.parse(event.target.result);
                    if(data.tasks) saveData('omni_tasks', data.tasks);
                    if(data.projects) saveData('omni_projects', data.projects);
                    if(data.income) saveData('omni_income', data.income);
                    if(data.roadmap) saveData('omni_roadmap', data.roadmap);
                    if(data.settings) saveData('omni_settings', data.settings);
                    alert('Data imported successfully!');
                    location.reload();
                } catch(err) { alert('Invalid file format'); }
            };
            reader.readAsText(file);
        }

        function clearData() {
            if(confirm('Are you sure? This deletes ALL data!')) {
                localStorage.clear();
                location.reload();
            }
        }

        function getPageContent() {
            return `
                <h2>Settings</h2>
                <div class="card mt-2" style="max-width: 500px;">
                    <div class="mb-1">
                        <label>Enable Custom Cursors</label><br>
                        <input type="checkbox" id="set-cursor" class="mt-05"> Use gear and checkmark cursors
                    </div>
                    <div class="mb-1 mt-1">
                        <label>Default Task View</label><br>
                        <select id="set-view" class="input-full mt-05">
                            <option value="kanban">Kanban</option><option value="list">List</option><option value="calendar">Calendar</option>
                        </select>
                    </div>
                    <button class="btn btn-primary" onclick="saveSettingsForm()">Save Preferences</button>
                    
                    <hr style="margin: 20px 0; border: 0; border-top: 1px solid var(--border);">
                    
                    <h3>Data Management</h3>
                    <div class="flex-row mt-1">
                        <button class="btn" onclick="exportData()"><i class="fas fa-download"></i> Export JSON</button>
                        <label class="btn"><i class="fas fa-upload"></i> Import JSON<input type="file" hidden accept=".json" onchange="importData(event)"></label>
                    </div>
                    <button class="btn" style="background: #ef4444; color: white; margin-top: 10px;" onclick="clearData()">Clear All Data</button>
                </div>
            `;
        }
    </script>
</body>
</html>
